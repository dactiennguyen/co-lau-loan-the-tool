# The Cloudflare Worker of CLLT Tool: the API that keeps the accounts of the desktop app in D1, and its admin page.
# How to deploy it: README.md.
name = "cllt-server"
main = "src/index.ts"
compatibility_date = "2026-10-01"
# colau.olachat.net: the zone olachat.net is in the same Cloudflare account; the deploy makes its DNS record and certificate.
routes = [{ pattern = "colau.olachat.net", custom_domain = true }]
# Only colau.olachat.net: the workers.dev address is off.
workers_dev = false

# The script of the admin page (client/admin.ts with the Material Web components), bundled before `wrangler dev` and
# `wrangler deploy` into public/, which Cloudflare serves as it is at /assets/admin.js, before the Worker.
[build]
command = "node scripts/build-client.mjs"

[assets]
directory = "./public"

[[d1_databases]]
binding = "DB"
database_name = "cllt"
# `npx wrangler d1 create cllt` prints the id of the database it made: put it here before `npm run db:migrate`.
# `npm run dev` uses a local database and does not need it.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# At most 60 requests a minute from one IP to /api/license/* (middlewares/api.middleware.ts), else 429: the app checks
# its key every hour and syncs every 15 minutes, so only a flood reaches it. namespace_id is any number unique in the
# Cloudflare account. The counts are kept at each Cloudflare location, not exactly.
[[ratelimits]]
name = "API_LIMIT"
namespace_id = "1001"
simple = { limit = 60, period = 60 }
