[package]
name = "cllt-desktop"
description = "Multi-account desktop app (Tauri 2; React + TypeScript UI in ../src) over cllt-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
# The `_lib` suffix keeps the library name apart from the binary's (cargo#8519).
name = "cllt_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The program cargo builds, and the name the dev app runs under (npm run tauri dev): macOS shows it in the Dock, the app
# switcher and the menu bar. `tauri build` renames it to mainBinaryName (cllt-desktop) in the bundles, so the installed
# app, its installers and its updates keep their file.
[[bin]]
name = "cllt-tool-dev"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
cllt-core = { path = "../../core" }
tauri = { workspace = true, features = ["tray-icon"] }
serde.workspace = true
serde_json.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
tauri-plugin-updater = "2.14"
# device.rs: the hello to CLLT Server, with the reqwest and rustls (ring) the updater already brings; the machine id of
# the system, hashed with sha2; the host name.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sha2 = "0.10"
machine-uid = "0.5"
# device.rs: the device key, 32 bytes of the system's random source (already in the tree).
getrandom = "0.3"
gethostname = "1"
tauri-plugin-notification = "2"

# tray.rs: keeps the app out of App Nap while its window is in the tray (already in the tree through tauri).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSProcessInfo", "NSString"] }
