[package]
name = "cllt-core"
description = "Protocol, battle and bots of Cờ Lau Loạn Thế, ported from src/ once proven there"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
indexmap = { version = "2", features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
# Gzip of the battle data (battle_record.rs); already in Cargo.lock through tauri.
flate2 = "1"
tokio.workspace = true

[[bin]]
name = "cllt"
path = "src/bin/cllt.rs"
