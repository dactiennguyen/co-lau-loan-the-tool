# Rust app of docs/integration/rust/README.md. TypeScript (src/, test/) stays the test bed: a feature is ported here once it
# runs there, and the opcode table and test vectors come from `npm run export:rust`.
[workspace]
members = ["core", "desktop/src-tauri"]
resolver = "3"

[workspace.package]
version = "1.1.7"
edition = "2021"
rust-version = "1.90"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tokio = { version = "1", features = ["net", "io-util", "time", "rt-multi-thread", "macros", "sync"] }
tauri = "2.12.5"
tauri-build = "2.7.4"

# Size settings of the Tauri template (https://tauri.app/concept/size/); profiles live in the workspace root.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
