name: Build Matrix

# Tests, then the desktop app (app/desktop) built for macOS Apple Silicon, macOS Intel, Windows x64 and Ubuntu x64.
# The bundles stay as artifacts of the run; release.yml calls this workflow on a v* tag and publishes them.
# Nothing is signed and there is no updater (docs/integration/rust/README.md#cicd-và-phát-hành).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: build-matrix-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "22"
  # app/Cargo.toml asks for 1.90; pinned so a new stable clippy lint does not fail the build on its own.
  RUST_TOOLCHAIN: "1.90.0"
  # Tauri 2 on Debian/Ubuntu (https://v2.tauri.app/start/prerequisites/#linux), plus patchelf for the AppImage.
  LINUX_PACKAGES: >-
    libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev
    libayatana-appindicator3-dev librsvg2-dev patchelf

jobs:
  preflight-ts:
    name: "Preflight: TypeScript tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Decoders, bots and docs links; test/rust-export.test.ts fails when app/core was not re-exported after a TS change.
      - name: npm test
        run: npm test

  preflight-rust:
    name: "Preflight: Rust fmt, clippy, tests"
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tauri system packages
        run: sudo apt-get update && sudo apt-get install -y $LINUX_PACKAGES

      - name: Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app -> target
          key: preflight

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/desktop/package-lock.json

      # tauri::generate_context! embeds app/desktop/dist, so the crate does not compile before the frontend is built.
      - name: Frontend (tsc, vite build)
        working-directory: app/desktop
        run: |
          npm ci
          npm run build

      - name: cargo fmt
        working-directory: app
        run: cargo fmt --all --check

      - name: cargo clippy
        working-directory: app
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        working-directory: app
        run: cargo test --workspace --locked

  build:
    name: "Build: ${{ matrix.label }}"
    needs: [preflight-ts, preflight-rust]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - label: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - label: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - label: Ubuntu x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tauri system packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_PACKAGES

      - name: Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app -> target
          key: ${{ matrix.target }}

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/desktop/package-lock.json

      - name: Frontend packages
        working-directory: app/desktop
        run: npm ci

      # beforeBuildCommand builds the frontend; --bundles overrides bundle.targets (only "app" in tauri.macos.conf.json).
      - name: tauri build
        working-directory: app/desktop
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npx tauri build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Stage bundles
        run: node .github/scripts/stage-bundles.mjs ${{ matrix.target }} staged

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.target }}
          path: staged/*
          if-no-files-found: error
          retention-days: 14
