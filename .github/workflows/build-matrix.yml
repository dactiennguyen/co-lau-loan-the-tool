name: Build Matrix

# Tests, then the desktop app (app/desktop) built for macOS Apple Silicon, macOS Intel, Windows x64 and Ubuntu x64 (on a
# release or a run started by hand; a push or pull request only tests).
# For a release (release.yml on a v* tag, with release_tag) each build uploads its bundles straight into the draft
# release that release.yml made, with RELEASE_TOKEN: no artifact, as the artifacts' storage quota stopped 1.1.9 and
# 1.1.10 on 04/11/2026. A run started by hand keeps them as artifacts of the run for a day. With the
# updater key in the secrets, each bundle also gets its updater file and .sig (docs/integration/rust/release.md#tự-cập-nhật);
# there is no Apple or Windows code signing (docs/integration/rust/release.md#cicd-và-phát-hành).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: The tag of the draft release the bundles go to (release.yml); empty for artifacts.
        type: string
        default: ""
      release_repo:
        description: owner/name of the repository of that release.
        type: string
        default: ""

concurrency:
  group: build-matrix-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "22"
  # app/Cargo.toml asks for 1.90; pinned so a new stable clippy lint does not fail the build on its own.
  RUST_TOOLCHAIN: "1.90.0"
  # Tauri 2 on Debian/Ubuntu (https://v2.tauri.app/start/prerequisites/#linux), plus patchelf for the AppImage.
  LINUX_PACKAGES: >-
    libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev
    libayatana-appindicator3-dev librsvg2-dev patchelf

jobs:
  preflight-ts:
    name: "Preflight: TypeScript tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/desktop/package-lock.json

      # TypeScript itself and the Node types, for the type-check.
      - name: npm ci
        run: npm ci

      # The tests import app/desktop/src/store/sync.ts and store/toasts.ts, which take types from the desktop's packages
      # (@tauri-apps/api): the type-check needs them installed as the app has them.
      - name: npm ci (app/desktop)
        run: npm ci
        working-directory: app/desktop

      # tsc --noEmit over src/ and test/, then decoders, bots and docs links; test/rust-export.test.ts fails when app/core
      # was not re-exported after a TS change.
      - name: npm test
        run: npm test

  preflight-rust:
    name: "Preflight: Rust fmt, clippy, tests"
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tauri system packages
        run: sudo apt-get update && sudo apt-get install -y $LINUX_PACKAGES

      - name: Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app -> target
          key: preflight
          # Saved from main only: a cache saved on a tag serves no later run, and would push out main's.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/desktop/package-lock.json

      # tauri::generate_context! embeds app/desktop/dist, so the crate does not compile before the frontend is built.
      - name: Frontend (tsc, vite build)
        working-directory: app/desktop
        run: |
          npm ci
          npm run build

      - name: cargo fmt
        working-directory: app
        run: cargo fmt --all --check

      - name: cargo clippy
        working-directory: app
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        working-directory: app
        run: cargo test --workspace --locked

  # The four builds only for a release (release.yml on a v* tag) or a run started by hand: a push or pull request runs
  # the tests alone, as the macOS minutes of a private repository count ten times (about 115 minutes a full run).
  build:
    name: "Build: ${{ matrix.label }}"
    needs: [preflight-ts, preflight-rust]
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - label: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - label: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - label: Ubuntu x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tauri system packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_PACKAGES

      - name: Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app -> target
          key: ${{ matrix.target }}
          # Builds run on tags and by hand. A tag restores what main saved but its own save would serve no later tag,
          # and four of them fill the 10 GB of caches: only a run started by hand on main saves (and warms the next
          # release).
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/desktop/package-lock.json

      - name: Frontend packages
        working-directory: app/desktop
        run: npm ci

      # beforeBuildCommand builds the frontend; --bundles overrides bundle.targets (only "app" in tauri.macos.conf.json).
      # With TAURI_SIGNING_PRIVATE_KEY in the secrets (pushes and tags of this repository; not pull requests from forks),
      # createUpdaterArtifacts makes the updater files and signs them; without it the build is the same, unsigned. The
      # setting goes in a file: a JSON string argument could lose its quotes on its way to npx on Windows.
      - name: tauri build
        working-directory: app/desktop
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          updater=()
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo '{"bundle":{"createUpdaterArtifacts":true}}' > updater.conf.json
            updater=(--config updater.conf.json)
          else
            echo "::warning::No TAURI_SIGNING_PRIVATE_KEY secret: built without the updater files."
          fi
          npx tauri build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} "${updater[@]}"

      - name: Stage bundles
        run: node .github/scripts/stage-bundles.mjs ${{ matrix.target }} staged SHA256SUMS-${{ matrix.target }}.txt

      # A release: into its draft, with the SHA-256 of this build for the SHA256SUMS.txt of the publish job. --clobber, so
      # a build run again replaces what it uploaded before.
      - name: Upload to the draft release
        if: ${{ inputs.release_tag != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GH_REPO: ${{ inputs.release_repo }}
          TAG: ${{ inputs.release_tag }}
        run: gh release upload "$TAG" staged/* "SHA256SUMS-${{ matrix.target }}.txt" --clobber

      # A run started by hand: artifacts of the run, for a day.
      - name: Upload bundles
        if: ${{ inputs.release_tag == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.target }}
          path: staged/*
          if-no-files-found: error
          retention-days: 1
