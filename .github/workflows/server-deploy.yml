# Deploys server/ (CLLT Server: the Cloudflare Worker and its D1 database) whenever it changes on main, or by hand
# (Actions → Deploy Server → Run workflow). The tests run first; a failure deploys nothing.
#
# Needs two repository secrets (server/README.md#tự-deploy-bằng-github-actions):
#   CLOUDFLARE_API_TOKEN   an API token with Account › Workers Scripts › Edit and Account › D1 › Edit, and for the custom
#                          domain of wrangler.toml, Zone › Workers Routes › Edit and Zone › DNS › Edit on olachat.net
#   CLOUDFLARE_ACCOUNT_ID  the account id of the Cloudflare dashboard
# Without them the run tests and says so, and deploys nothing. The D1 database "cllt" is made on the first run; its id
# is written into the runner's copy of wrangler.toml only (scripts/d1-id.mjs), so nothing has to be committed for it.
name: Deploy Server

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/server-deploy.yml"
  workflow_dispatch:

# One deploy at a time, the later one after the earlier.
concurrency:
  group: server-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  deploy:
    name: Test and deploy to Cloudflare
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Cloudflare secrets
        id: secrets
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "set=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::CLOUDFLARE_API_TOKEN và CLOUDFLARE_ACCOUNT_ID chưa có trong secret của repo: đã test, chưa deploy (server/README.md)."
            echo "set=false" >> "$GITHUB_OUTPUT"
          fi

      - name: D1 database
        if: steps.secrets.outputs.set == 'true'
        run: npm run d1:id

      - name: Migrations
        if: steps.secrets.outputs.set == 'true'
        run: npx wrangler d1 migrations apply cllt --remote

      - name: Deploy
        if: steps.secrets.outputs.set == 'true'
        run: |
          # The step's shell has no pipefail: without it a failed deploy would pass through tee.
          set -o pipefail
          npx wrangler deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -n "$url" ]; then
            echo "Trang quản trị: $url/admin" >> "$GITHUB_STEP_SUMMARY"
          fi
